    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Dark Mode (Default) */
            --bg: #050505;
            --fg: #f4f4f4;
            --accent: #e60012; /* Crimson */
            
            --text-main: #f4f4f4;
            --text-inverse: #050505;
            --text-muted: #aaaaaa;

            --border-w: 5px;
            --img-filter: grayscale(100%) contrast(1.4) invert(0);
            
            --font-impact: 'Anton', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        body.paper-mode {
            /* Paper Mode (Light) */
            --bg: #f4f4f4;
            --fg: #050505;
            --accent: #e60012;
            
            --text-main: #050505;
            --text-inverse: #f4f4f4;
            --text-muted: #555555;

            --img-filter: grayscale(100%) contrast(1.4) invert(1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0s, color 0s;
        }

        /* --- Ghost of Tsushima GAME LOADER (Gamified Cinematic) --- */
        #game-loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 100000; background: #000; display: flex;
            align-items: center; justify-content: flex-start; overflow: hidden;
            font-family: 'Noto Sans JP', serif;
        }
        
        .gl-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; background: #000;
        }
        
        .gl-bg video {
            width: 100%; height: 100%; object-fit: cover;
            /* Raw video, no GPU filters */
        }

        .gl-bg-overlay {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.4); /* Subtle vignette/darken for readability */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            z-index: 2;
        }

        .gl-content {
            position: relative; z-index: 10; width: 50%; min-width: 400px;
            height: 100%; display: flex; flex-direction: column; justify-content: space-between;
            padding: 5vw; box-sizing: border-box; text-align: left;
        }

        .gl-title {
            font-family: 'Noto Sans JP', serif; font-size: clamp(2rem, 4vw, 4rem); font-weight: 300;
            color: #fff; letter-spacing: 5px; text-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        .gl-bottom-area {
            display: flex; flex-direction: column; align-items: flex-start; gap: 20px;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
            padding: 30px; border-left: 4px solid var(--accent);
        }

        .gl-tips {
            font-family: 'Noto Sans JP', serif; font-weight: 300; font-size: 1rem; color: #fff; letter-spacing: 1px;
            margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .gl-kamon {
            width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
            border-top-color: #fff; border-right-color: #fff;
            animation: spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Gamified Boot Sequence */
        .gl-progress-container {
            width: 100%; margin-top: 10px;
        }
        #gl-progress-text {
            font-family: 'Noto Sans JP', monospace; font-size: 0.8rem; color: #fff; margin-bottom: 5px;
            letter-spacing: 2px; text-shadow: 0 0 5px #000;
        }
        .gl-progress-bar {
            width: 100%; height: 2px; background: rgba(255,255,255,0.2);
            position: relative; overflow: hidden;
        }
        #gl-progress-fill {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: #fff; box-shadow: 0 0 10px #fff; transition: width 0.1s linear;
        }

        .gl-start-btn {
            position: relative; z-index: 1000;
            font-family: 'Noto Sans JP', serif; font-weight: 300; font-size: 1.2rem; color: #fff; letter-spacing: 3px;
            cursor: pointer; opacity: 0; transition: opacity 0.5s;
            animation: pulseBtn 3s infinite; pointer-events: auto; display: none;
        }
        @keyframes pulseBtn {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; text-shadow: 0 0 10px #fff; }
        }

        /* --- Custom Cursor (FIXED) --- */
        #cursor-crosshair {
            position: fixed; top: 0; left: 0; width: 30px; height: 30px;
            border: 2px solid var(--accent); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1000000;
            background: rgba(230, 0, 18, 0.15); box-shadow: 0 0 10px rgba(230, 0, 18, 0.5);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }
        #cursor-crosshair::before, #cursor-crosshair::after { content: ''; position: absolute; background: var(--accent); }
        #cursor-crosshair::before { top: 50%; left: -5px; right: -5px; height: 2px; transform: translateY(-50%); }
        #cursor-crosshair::after { left: 50%; top: -5px; bottom: -5px; width: 2px; transform: translateX(-50%); }
        
        body.hovering #cursor-crosshair { width: 60px; height: 60px; background: rgba(230, 0, 18, 0.3); }

        /* --- Ghost of Tsushima: Fog & Leaves --- */
        #leaves-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 999;
        }

        .fog-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50vh;
            background: linear-gradient(to top, var(--bg) 0%, transparent 100%);
            z-index: 5; pointer-events: none;
        }

        /* Cinematic Letterboxing */
        .cinematic-bar {
            position: fixed; left: 0; width: 100vw; height: 8vh;
            background: #000; z-index: 10000; transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .cinematic-bar.top { top: 0; transform: translateY(-100%); }
        .cinematic-bar.bottom { bottom: 0; transform: translateY(100%); }
        body.cinematic-active .cinematic-bar.top { transform: translateY(0); }
        body.cinematic-active .cinematic-bar.bottom { transform: translateY(0); }

        /* --- Textures --- */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999; opacity: 0.05;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        .halftone {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, var(--fg) 2px, transparent 2.5px);
            background-size: 10px 10px; opacity: 0.15; pointer-events: none; z-index: 0;
        }
        .halftone-accent { background-image: radial-gradient(circle, var(--accent) 2px, transparent 2.5px); opacity: 0.3; }

        /* --- Katana Slash Transition --- */
        #slash-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; overflow: hidden; display: none; }
        .slash-line { position: absolute; top: 50%; left: 50%; width: 200vw; height: 4px; background: #fff; transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); box-shadow: 0 0 20px #fff; }
        .slash-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

        .theme-toggle {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            background: var(--bg); color: var(--text-main); border: 3px solid var(--fg);
            padding: 10px 20px; font-family: var(--font-impact); font-size: 1.5rem;
            box-shadow: 5px 5px 0px var(--accent); transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0px var(--accent); }

        /* --- Typography & SFX --- */
        h1, h2, h3, .impact-text { font-family: var(--font-impact); text-transform: uppercase; line-height: 1.1; margin: 0; letter-spacing: 1px; }
        
        .kanji-bg {
            position: absolute; font-family: var(--font-jp); font-weight: 900; font-size: 15rem;
            color: var(--fg); opacity: 0.05; line-height: 1; white-space: nowrap; z-index: 0; pointer-events: none; user-select: none;
        }

        .sfx {
            position: absolute; font-family: var(--font-jp); font-weight: 900; font-size: 4rem;
            color: var(--accent); text-shadow: 4px 4px 0px var(--fg); z-index: 20; pointer-events: none;
            opacity: 0; transform: scale(0.5); transition: opacity 0.3s, transform 0.3s;
        }
        .panel:hover .sfx-hover { opacity: 1; transform: scale(1) rotate(-10deg); }

        /* --- Manga Layout Grid --- */
        .page-container { max-width: 1400px; margin: 0 auto; padding: 5vw; position: relative; }
        
        .chapter-title { text-align: center; font-size: clamp(3rem, 6vw, 6rem); margin: 15vh 0 10vh 0; position: relative; z-index: 10; text-shadow: 5px 5px 0px var(--accent); }

        .manga-grid { display: grid; grid-gap: 20px; margin-bottom: 50px; position: relative; }

        .panel {
            background: var(--bg); border: var(--border-w) solid var(--fg); position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; padding: 2.5rem;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            z-index: 1; opacity: 0; transform: translateY(50px) scale(0.95);
        }
        .panel-shadow { box-shadow: 10px 10px 0px var(--fg); }
        .panel-inverse { background: var(--fg); color: var(--text-inverse); }
        .panel-inverse .halftone { background-image: radial-gradient(circle, var(--bg) 2px, transparent 2.5px); }
        
        .panel-slanted-1 { clip-path: polygon(2% 0, 100% 2%, 98% 100%, 0 98%); }
        .panel-slanted-2 { clip-path: polygon(0 2%, 98% 0, 100% 98%, 2% 100%); }
        
        .panel.interactive:hover { transform: translate(-5px, -5px) scale(1.02); box-shadow: 15px 15px 0px var(--accent); border-color: var(--accent); z-index: 10; }
        .panel.interactive:hover .panel-bg-img { transform: scale(1.1); filter: var(--img-filter) brightness(1.2); }
        .panel.interactive:hover .speed-lines { opacity: 0.15; }

        .panel-content { position: relative; z-index: 2; }
        .panel-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--img-filter); opacity: 0.5; transition: transform 0.5s, filter 0.5s; z-index: 0; }

        .speed-lines { position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; background: repeating-conic-gradient(from 0deg, transparent 0deg 10deg, var(--fg) 10deg 11deg); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; z-index: 1; transition: opacity 0.3s; animation: rotateSpeed 20s linear infinite; }
        @keyframes rotateSpeed { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Specific Panel Grids */
        .grid-hero { grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-areas: "avatar avatar title title" "avatar avatar title title" "avatar avatar bio stats"; }
        @media (max-width: 1024px) { .grid-hero { grid-template-columns: 1fr; grid-template-areas: "avatar" "title" "bio" "stats"; } }

        .panel-avatar { grid-area: avatar; min-height: 500px; padding: 0; border: none; overflow: visible; background: transparent; box-shadow: none; }
        .panel-avatar img { width: 100%; height: 100%; object-fit: cover; filter: var(--img-filter); border: var(--border-w) solid var(--fg); box-shadow: 15px 15px 0px var(--accent); clip-path: polygon(0 0, 100% 5%, 95% 100%, 5% 95%); }
        .panel-title { grid-area: title; background: var(--fg); color: var(--text-inverse); text-align: center; justify-content: center; padding: 2rem;}
        .panel-bio { grid-area: bio; font-size: 1.1rem; line-height: 1.6; }
        .panel-stats { grid-area: stats; background: var(--accent); color: #fff; border-color: var(--accent); }

        .grid-arsenal { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 300px; }
        .panel-wide { grid-column: span 2; }
        @media (max-width: 900px) { .grid-arsenal { grid-template-columns: 1fr; } .panel-wide { grid-column: span 1; } }
        
        .project-title { font-size: clamp(2rem, 3.5vw, 3.5rem); margin-bottom: 10px; line-height: 1.1; color: var(--text-main); text-shadow: 3px 3px 0px var(--bg); }
        .panel-inverse .project-title { color: var(--text-inverse); text-shadow: 3px 3px 0px var(--accent); }
        .project-desc { font-weight: 600; font-size: 1.1rem; }
        .panel-inverse .project-desc { color: var(--text-inverse); }
        .project-link { position: absolute; inset: 0; z-index: 10; }

        /* Horizontal Scroll Journey */
        .h-scroll-container { width: 100vw; height: 100vh; overflow: hidden; position: relative; background: var(--bg); display: flex; align-items: center; }
        .h-scroll-wrapper { display: flex; width: max-content; height: 75vh; padding: 0 10vw; gap: 4vw; }
        .h-panel { width: 500px; height: 100%; background: var(--bg); border: var(--border-w) solid var(--fg); box-shadow: 10px 10px 0px var(--fg); flex-shrink: 0; padding: 2.5rem; position: relative; display: flex; flex-direction: column; justify-content: center; }
        @media (max-width: 768px) { .h-panel { width: 85vw; } }
        .stat-row { display: flex; justify-content: space-between; border-bottom: 3px solid var(--fg); padding: 12px 0; font-weight: 800; font-family: var(--font-impact); font-size: 1.5rem;}
        .stat-val { color: var(--accent); text-shadow: 1px 1px 0px var(--bg); }

        .manga-badge { display: inline-block; border: 3px solid var(--fg); padding: 6px 12px; font-family: var(--font-impact); font-size: 1.1rem; margin: 4px; background: var(--bg); color: var(--text-main); transition: all 0.2s; }
        .manga-badge:hover { background: var(--fg); color: var(--text-inverse); }

        .speech-bubble { position: absolute; top: -20px; right: -20px; background: var(--fg); color: var(--text-inverse); border: 4px solid var(--bg); font-family: var(--font-impact); padding: 10px 20px; font-size: 1.5rem; transform: rotate(15deg); z-index: 20; box-shadow: 6px 6px 0px var(--accent); }

    </style>
</head>

    <script>
        // Global UI Sounds
        window.globalAudio = new (window.AudioContext || window.webkitAudioContext)();
        window.globalAudio.playHoverSound = function() {
            if(window.globalAudio.state === 'suspended') window.globalAudio.resume();
            const osc = window.globalAudio.createOscillator();
            const gain = window.globalAudio.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, window.globalAudio.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, window.globalAudio.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, window.globalAudio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, window.globalAudio.currentTime + 0.05);
            osc.connect(gain); gain.connect(window.globalAudio.destination);
            osc.start(); osc.stop(window.globalAudio.currentTime + 0.05);
        };

        window.globalAudio.playSlash = function() {
            if(window.globalAudio.state === 'suspended') window.globalAudio.resume();
            const osc = window.globalAudio.createOscillator();
            const gain = window.globalAudio.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, window.globalAudio.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, window.globalAudio.currentTime + 0.4);
            gain.gain.setValueAtTime(0.5, window.globalAudio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, window.globalAudio.currentTime + 0.4);
            osc.connect(gain); gain.connect(window.globalAudio.destination);
            osc.start(); osc.stop(window.globalAudio.currentTime + 0.4);
        };

        window.globalAudio.playSlam = function() {
            if(window.globalAudio.state === 'suspended') window.globalAudio.resume();
            const osc = window.globalAudio.createOscillator();
            const gain = window.globalAudio.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, window.globalAudio.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, window.globalAudio.currentTime + 0.5);
            gain.gain.setValueAtTime(1, window.globalAudio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, window.globalAudio.currentTime + 0.5);
            osc.connect(gain); gain.connect(window.globalAudio.destination);
            osc.start(); osc.stop(window.globalAudio.currentTime + 0.5);
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Attach sounds to all interactive elements
            document.querySelectorAll('a, button, .interactive, .terminal-button, .manga-badge').forEach(el => {
                el.addEventListener('mouseenter', window.globalAudio.playHoverSound);
            });
        });
    </script>

    <script>
        // --- Custom Cursor (Fixed visibility) ---
        const cursor = document.getElementById('cursor-crosshair');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2, cX = mouseX, cY = mouseY;
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateCursor() {
            cX += (mouseX - cX) * 0.3; cY += (mouseY - cY) * 0.3;
            cursor.style.transform = `translate(${cX}px, ${cY}px)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Game Tips Array
        const tips = [
            "Hover over projects to reveal their true form...",
            "A Ronin writes his own path. This portfolio uses a headless JSON engine.",
            "Scroll horizontally to view the timeline of experience...",
            "Click SLASH MODE to invert the reality of the page..."
        ];
        let tipIdx = 0;
        setInterval(() => {
            tipIdx = (tipIdx + 1) % tips.length;
            document.getElementById('gl-tip-text').innerText = tips[tipIdx];
        }, 3000);

        // --- Fetch CMS Data & Boot Sequence ---
        fetch('content.json')
            .then(res => res.json())
            .then(data => {
                renderHero(data.hero);
                renderProjects(data.projects);
                renderJourney(data.quests, data.achievements, data.trophies);
                renderEpilogue(data.socials);
                
                // Start Boot Sequence
                runBootSequence();
            });

        function runBootSequence() {
            let progress = 0;
            const progressFill = document.getElementById('gl-progress-fill');
            const progressText = document.getElementById('gl-progress-text');
            
            const bootInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 20) + 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(bootInterval);
                    setTimeout(finishBooting, 300); // Tiny pause at 100%
                }
                progressFill.style.width = progress + '%';
                progressText.innerText = `CONNECTING TO AEGIS SERVER... [${progress}%]`;
            }, 200);
        }

        function finishBooting() {
            document.getElementById('gl-kamon').style.display = 'none';
            document.getElementById('gl-progress-container').style.display = 'none';
            
            const startBtn = document.getElementById('gl-start-btn');
            startBtn.style.display = 'block';
            void startBtn.offsetWidth; // Reflow
            startBtn.style.opacity = '1';
        }

        // --- Katana Slice Interactive Loader Wipe ---
        function startGame() {
            const video = document.getElementById('gl-video');
            if (video) video.pause(); // Freeze video frame for precise slice

            const loader = document.getElementById('game-loader');
            
            const slashOverlay = document.getElementById('slash-overlay');
            const slashLine = document.getElementById('slash-line');
            const slashFlash = document.getElementById('slash-flash');
            
            slashOverlay.style.display = 'block';
            slashOverlay.style.zIndex = '1000000'; // Above everything

            // Clone loader during flash
            const clone = loader.cloneNode(true);
            clone.id = 'game-loader-clone';
            
            // Set initial clip paths (uncut)
            loader.style.clipPath = 'inset(0 0 0 0)';
            clone.style.clipPath = 'inset(0 0 0 0)';
            document.body.appendChild(clone);

            const tl = gsap.timeline({
                onComplete: () => {
                    gsap.to(loader, {
                        opacity: 0,
                        duration: 1,
                        delay: 0.5,
                        onStart: () => {
                            if(window.globalAudio && window.globalAudio.playSlash) window.globalAudio.playSlash();
                            if(typeof startBGM === 'function') startBGM();
                        },
                        onComplete: () => {
                            loader.remove();
                            clone.remove();
                            slashOverlay.style.display = 'none';
                            document.body.style.overflow = 'auto';
                            document.getElementById('smooth-content').style.opacity = '1';
                            
                            if(window.globalAudio && window.globalAudio.playSlam) window.globalAudio.playSlam();
                            initAnimations();
                            setTimeout(() => ScrollTrigger.refresh(), 100);
                        }
                    });
                }
            });

            // 1. The Blinding Slash
            tl.to(slashLine, { scaleX: 1, duration: 0.1, ease: "power4.inOut" })
              .to(slashLine, { height: '100vh', rotation: 0, duration: 0.15, ease: "power4.in" })
              .to(slashFlash, { opacity: 1, duration: 0.05 }, "-=0.1")
              // 2. The Physical Cut (Happens secretly under the white flash)
              .call(() => {
                  loader.style.clipPath = 'inset(0 0 50% 0)'; // Top Half
                  clone.style.clipPath = 'inset(50% 0 0 0)'; // Bottom Half
              })
              // 3. The Halves Slide Apart
              .to(slashFlash, { opacity: 0, duration: 0.4 })
              .to(slashLine, { opacity: 0, duration: 0.2 }, "-=0.4")
              .to(loader, { yPercent: -100, duration: 0.8, ease: "power3.inOut" }, "-=0.3")
              .to(clone, { yPercent: 100, duration: 0.8, ease: "power3.inOut" }, "-=0.8");
        }

        function renderEpilogue(socials) {

                    <!-- Mode Selector -->

                            <div class="interactive" onclick="window.startGhostGame('easy')" style="cursor: pointer; background: url('bg_bamboo.png') center/cover; width: 250px; height: 350px; border: 2px solid #555; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 20px; box-shadow: 0 0 20px rgba(0,255,100,0.2); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                                <h2 style="color: #00ffcc; text-shadow: 2px 2px 0 #000; font-size: 2rem;">EASY</h2>
                                <span style="font-size: 1rem; color: #fff; text-shadow: 1px 1px 0 #000; text-align: center;">THE BAMBOO JUNGLE</span>
                            </div>
                            <div class="interactive" onclick="window.startGhostGame('hard')" style="cursor: pointer; background: url('bg_bloodmoon.png') center/cover; width: 250px; height: 350px; border: 2px solid #ff3333; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 20px; box-shadow: 0 0 20px rgba(255,50,50,0.5); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">

            window.startGhostGame = function(mode) {

                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                window.ghostGame = new GhostEngine('gameCanvas', mode);
                
                canvas.parentElement.addEventListener('mouseenter', () => {
                    document.getElementById('game-controls').style.opacity = '1';
                });
                canvas.parentElement.addEventListener('mouseleave', () => {
                    document.getElementById('game-controls').style.opacity = '0.5';
                });
            };
        }

        // --- Animations & Layout ---
        function initAnimations() {
            // Ghost of Tsushima: Momiji Leaves
            const canvas = document.getElementById('leaves-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const leaves = [];
            for(let i = 0; i < 30; i++) {
                leaves.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 5 + 5,
                    speedX: Math.random() * 2 + 1,
                    speedY: Math.random() * 1 + 0.5,
                    angle: Math.random() * 360,
                    spin: Math.random() * 0.2 - 0.1
                });
            }
            function drawLeaves() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e60012';
                leaves.forEach(leaf => {
                    ctx.save(); ctx.translate(leaf.x, leaf.y); ctx.rotate(leaf.angle);
                    ctx.beginPath(); ctx.moveTo(0, -leaf.size);
                    ctx.quadraticCurveTo(leaf.size, -leaf.size/2, 0, leaf.size);
                    ctx.quadraticCurveTo(-leaf.size, -leaf.size/2, 0, -leaf.size);
                    ctx.fill(); ctx.restore();
                    leaf.x += leaf.speedX; leaf.y += leaf.speedY; leaf.angle += leaf.spin;
                    if(leaf.x > canvas.width + 20) leaf.x = -20;
                    if(leaf.y > canvas.height + 20) leaf.y = -20;
                });
                requestAnimationFrame(drawLeaves);
            }
            drawLeaves();
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

            document.querySelectorAll('.interactive, a, .gl-start-btn').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });

            const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smooth: true });
            function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
            requestAnimationFrame(raf);

            gsap.registerPlugin(ScrollTrigger);

            gsap.utils.toArray('.gs-slam').forEach(panel => {
                gsap.to(panel, {
                    y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)",
                    scrollTrigger: { trigger: panel, start: "top 85%", toggleActions: "play none none reverse" }
                });
            });

            const hContainer = document.getElementById('h-container');
            const hWrapper = document.getElementById('journey-wrapper');
            gsap.to(hWrapper, {
                x: () => -(hWrapper.scrollWidth - window.innerWidth), ease: "none",
                scrollTrigger: {
                    trigger: hContainer, pin: true, scrub: 1, start: "center center",
                    end: () => "+=" + (hWrapper.scrollWidth - window.innerWidth),
                    invalidateOnRefresh: true,
                    onEnter: () => document.body.classList.add('cinematic-active'),
                    onLeaveBack: () => document.body.classList.remove('cinematic-active'),
                    onLeave: () => document.body.classList.remove('cinematic-active'),
                    onEnterBack: () => document.body.classList.add('cinematic-active')
                }
            });

            const themeBtn = document.getElementById('theme-btn');
            const slashOverlay = document.getElementById('slash-overlay'), slashLine = document.getElementById('slash-line'), slashFlash = document.getElementById('slash-flash');
            let isPaperMode = false;

            themeBtn.addEventListener('click', () => {
                lenis.stop(); slashOverlay.style.display = 'block'; slashOverlay.style.zIndex = '9998';
                const tl = gsap.timeline({ onComplete: () => { slashOverlay.style.display = 'none'; lenis.start(); } });

                tl.to(slashLine, { scaleX: 1, duration: 0.1, ease: "power4.inOut" })
                  .to(slashLine, { height: '100vh', rotation: 0, duration: 0.2, ease: "power4.in" })
                  .to(slashFlash, { opacity: 1, duration: 0.05 }, "-=0.1")
                  .call(() => {
                      isPaperMode = !isPaperMode;
                      if(isPaperMode) { document.body.classList.add('paper-mode'); themeBtn.innerText = "DARK MODE"; } 
                      else { document.body.classList.remove('paper-mode'); themeBtn.innerText = "SLASH MODE"; }
                      ScrollTrigger.refresh();
                  })
                  .to(slashFlash, { opacity: 0, duration: 0.3 })
                  .to(slashLine, { opacity: 0, duration: 0.1 }, "-=0.3")
                  .set(slashLine, { scaleX: 0, height: '4px', rotation: -45, opacity: 1 });
            });
        }
    </script>
